name: MoneyFlow CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate HTTPS proxy configuration
        shell: bash
        env:
          DB_PASSWORD: ci-only-placeholder
        run: |
          docker compose config --quiet
          docker run --rm -v "${{ github.workspace }}/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Check PowerShell scripts syntax
        shell: pwsh
        run: |
          Get-ChildItem scripts -Recurse -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell syntax error: $($_.FullName)"
            }
          }
      - name: Frontend syntax
        run: |
          node --check frontend/app.js
          node --check frontend/pwa.js
          node --check frontend/sw.js
          node tests/frontend-smoke.mjs
          node tests/pwa-smoke.mjs
      - name: Build isolated test runner
        run: docker build -f Dockerfile.test -t moneyflow-test:ci .
      - name: Run API tests without network
        run: docker run --rm --network none moneyflow-test:ci
      - name: Build application image
        run: docker build -t moneyflow-app:ci .
  postgres-financial-safety:
    name: Financial safety on PostgreSQL 18
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: moneyflow_test
          POSTGRES_USER: moneyflow_test
          POSTGRES_PASSWORD: ci-only-moneyflow-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moneyflow_test -d moneyflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL_POSTGRES_TEST: postgresql+psycopg://moneyflow_test:ci-only-moneyflow-test@127.0.0.1:5432/moneyflow_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install test requirements
        run: pip install -r backend/requirements.txt 'pytest>=8,<10' 'httpx>=0.27,<1'
      - name: Transaction safety integration tests (real PostgreSQL)
        run: python -m pytest -q tests/test_financial_safety.py -k postgresql
