name: MoneyFlow Dependency Auto Merge
on:
  workflow_run:
    workflows:
      - MoneyFlow CI
    types:
      - completed
permissions:
  contents: write
  pull-requests: write
jobs:
  merge-verified-python:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check source PR metadata and changed files; merge only compatible pins
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # Do not evaluate untrusted input as a shell command.
          gh api "repos/$REPOSITORY/pulls?state=open&per_page=100" > /tmp/moneyflow-prs.json
          python3 - <<'PY'
          import json,os,re,subprocess,sys
          prs=json.load(open('/tmp/moneyflow-prs.json'))
          sha=os.environ['TESTED_SHA'];repo=os.environ['REPOSITORY']
          items=[p for p in prs if p['head']['sha']==sha and
                 p['user']['login']=='dependabot[bot]' and p['base']['ref'] in ('main','master') and
                 p['head']['repo']['full_name']==repo]
          if len(items)!=1:
              print('Not exactly one eligible Dependabot PR; manual review required.')
              sys.exit(0)
          number=items[0]['number']
          res=subprocess.run(['gh','api',f'repos/{repo}/pulls/{number}/files?per_page=100'],
                             capture_output=True,text=True,check=True)
          files=json.loads(res.stdout)
          if len(files)!=1 or files[0]['filename']!='backend/requirements.txt':
              print('Non-Python or multi-file dependency change; manual review required.')
              sys.exit(0)
          patch=files[0].get('patch','')
          old={};new={}
          line_pattern=re.compile(r'^([A-Za-z][A-Za-z0-9_.-]*(?:\[[A-Za-z,]+\])?)==([0-9]+(?:\.[0-9]+){1,3})$')
          for line in patch.splitlines():
              if not line or line[0] not in '+-' or line[:3] in ('+++','---'):continue
              m=line_pattern.fullmatch(line[1:])
              if not m:
                  print('Unexpected requirements patch line; manual review required:',line[:90]);sys.exit(0)
              (new if line[0]=='+' else old)[m[1]]=tuple(int(i) for i in m[2].split('.'))
          if not old or old.keys()!=new.keys():
              print('Unexpected dependency additions/removals; manual review required.');sys.exit(0)
          for pkg,prev in old.items():
              nxt=new[pkg]
              if nxt<=prev or nxt[0]!=prev[0] or (prev[0]==0 and nxt[1]!=prev[1]):
                  print(f'Major or pre-1 minor upgrade: {pkg} {prev} -> {nxt}; manual review required.')
                  sys.exit(0)
          print('CI succeeded, only same-major Python pins changed. Auto-merging PR',number)
          subprocess.run(['gh','pr','merge',str(number),'-R',repo,'--squash','--delete-branch'],check=True)
          PY
