name: MoneyFlow Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag and VERSION consistency
        shell: bash
        run: |
          test "v$(cat VERSION | tr -d '\r\n')" = "$GITHUB_REF_NAME"
      - name: Validate HTTPS proxy configuration
        shell: bash
        env:
          DB_PASSWORD: ci-only-placeholder
        run: |
          docker compose config --quiet
          docker run --rm -v "${{ github.workspace }}/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Check PowerShell scripts syntax
        shell: pwsh
        run: |
          Get-ChildItem scripts -Recurse -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell syntax error: $($_.FullName)"
            }
          }
      - name: JavaScript syntax
        run: |
          node --check frontend/app.js
          node tests/frontend-smoke.mjs
      - name: Build test image
        run: docker build -f Dockerfile.test -t moneyflow-test:release .
      - name: Test backend (isolated, offline)
        run: docker run --rm --network none moneyflow-test:release
      - name: Build application image
        run: docker build -t moneyflow-app:${{ github.ref_name }} .
  publish-release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Pack safe source ZIP and SHA-256
        shell: pwsh
        run: ./scripts/package.ps1 -Version '${{ github.ref_name }}'
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/MoneyFlow-Local-${GITHUB_REF_NAME}-Full-Source.zip" \
            "dist/MoneyFlow-Local-${GITHUB_REF_NAME}-Full-Source.zip.sha256" \
            --verify-tag \
            --generate-notes \
            --title "MoneyFlow Local $GITHUB_REF_NAME"
      - name: Verify published Release files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          zip="MoneyFlow-Local-${tag}-Full-Source.zip"
          for attempt in 1 2 3 4 5; do
            if gh release view "$tag" --json tagName,isDraft,publishedAt,assets,url | \
                jq -e --arg tag "$tag" --arg zip "$zip" \
                  '.tagName == $tag and (.isDraft | not) and (.publishedAt != null) and
                   any(.assets[]?; .name == $zip and .size > 0) and
                   any(.assets[]?; .name == ($zip + ".sha256") and .size > 0)' >/dev/null; then
              url="$(gh release view "$tag" --json url --jq '.url')"
              echo "### Release $tag successfully published" >> "$GITHUB_STEP_SUMMARY"
              echo "- Release URL: $url" >> "$GITHUB_STEP_SUMMARY"
              echo "- Verified: source ZIP and SHA-256 assets" >> "$GITHUB_STEP_SUMMARY"
              echo "RELEASE VERIFIED: $url"
              exit 0
            fi
            sleep 4
          done
          echo "ERROR: Release $tag not published with both expected assets" >&2
          exit 1
