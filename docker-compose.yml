name: moneyflow-local
services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:5435:5432"
    environment:
      POSTGRES_DB: moneyflow
      POSTGRES_USER: moneyflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run scripts/start.ps1 to generate a database password}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - moneyflow_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneyflow -d moneyflow"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks: [private]
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://moneyflow:${DB_PASSWORD}@db:5432/moneyflow
      COOKIE_SECURE: "false"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:8765:8000"
    depends_on:
      db:
        condition: service_healthy
    networks: [private]
networks:
  private:
    driver: bridge
volumes:
  moneyflow_db:
